simu_init:
  # simu_name: "toy10_fixed-angle_hier-lin_joint_censored-disjointPMALA_regu2_IMTMScalingFactor1p5_truestartboth"
  # simu_name: "toy10_fixed-angle_hier-lin_AuxOnlyUncensored_StartAuxTrueCensoredObsUncensored_mixtaddmult"
  simu_name : "toy30_hier_xi_noncentered"
  cloud_name: "astro_toy_N30"
  max_workers: 10
  #
  params_names:
    kappa: $\kappa$
    P: $P_{th}$
    radm: $G_0$
    Avmax: $A_V^{tot}$
    angle: $\alpha$
  #
  list_lines_fit:
    - "co_v0_j4__v0_j3"
    - "co_v0_j5__v0_j4"
    - "co_v0_j6__v0_j5"
    - "co_v0_j7__v0_j6"
    - "co_v0_j8__v0_j7"
    - "co_v0_j9__v0_j8"
    - "co_v0_j10__v0_j9"
    - "co_v0_j11__v0_j10"
    - "co_v0_j12__v0_j11"
    - "co_v0_j13__v0_j12"
#
to_run_optim_map: false
to_run_mcmc: true
#
forward_model:
  forward_model_name: "meudon_pdr_model_dense"
  force_use_cpu: false
  fixed_params: # must contain all the params in list_names of the Simulation object. Values are in linear scale.
    kappa: null
    P: null
    radm: null
    Avmax: null
    angle: 0.0
  is_log_scale_params: # defines the scale to work with for each param (either log or lin)
    kappa: True
    P: True
    radm: True
    Avmax: True
    angle: False
#
#
sigma_a_float: 1.38715e-10
sigma_m_float_linscale: 2.0
#
# Component distributions and target distributions
component_distributions:
  theta_indicator_prior:
    module: beetroots.modelling.priors.smooth_indicator_prior
    class_name: "SmoothIndicatorPrior"
    do_scaling: True
    params:
      var_name: "full_conditional_theta"
      indicator_margin_scale: 1.0e-4
      lower_bounds_lin:
        - 1.0e-1 # kappa
        - 1.0e+5 # thermal pressure
        - 1.0e+0 # G0
        - 1.0e+0 # AVtot
        - 0.0 # angle
      upper_bounds_lin:
        - 1.0e+1 # kappa
        - 1.0e+9 # thermal pressure
        - 1.0e+5 # G0
        - 4.0e+1 # AVtot
        - 60.0 # angle
  theta_spatial_prior:
    module: beetroots.modelling.priors.l22_discrete_grad_prior
    class_name: "L22DiscreteGradSpatialPrior"
    params:
      name: "L2-discrete-grad"
      var_name: "full_conditional_theta"
      use_next_nearest_neighbors: false
      initial_regu_weights: [9.4, 9.4, 9.4, 9.4, 9.4]
  obs_given_target_log_xi:
    module: beetroots.modelling.hierarchical.obs_given_target_log_xi
    class_name: "ObservationsGivenTargetLogXi"
    params:
      var_names_dict:
        target: 'full_conditional_theta'
        log_xi: 'full_conditional_log_xi'
  log_xi_prior:
    module: beetroots.modelling.hierarchical.obs_given_target_log_xi
    class_name: "LogXiPrior"
    params:
      var_name: "full_conditional_log_xi"
      mean_log_xi: 0.0
      var_log_xi: 1.0
#
target_distributions:
  full_conditional_theta: ["theta_indicator_prior", "theta_spatial_prior", "obs_given_target_log_xi"]
  full_conditional_log_xi: ["log_xi_prior", "obs_given_target_log_xi"]
#
param_interest_name: "full_conditional_theta"
# sampling params
sampling_params:
  mcmc:
    model_checking_component_name: "obs_given_target_log_xi"
    sample_variables:
      full_conditional_theta: true
      full_conditional_log_xi: true
    start_from_type:
      full_conditional_theta: "random"
      full_conditional_log_xi: "random"
    kernels_dic:
      joint:
        global_proba: 0.5
        1:
          module_name: "joint_pmala_xi_approx"
          class_name: "KernelPMALAApproxCensored"
          external_parameters: {eps0: 1.0e-3, lambda_: 1.0e-5, alpha: 0.99, compute_correction_term: false, add_perturbation: true, acceptance_wise_type: "pixelwise"}
        2:
          module_name: "joint_mtm_mixture_neighbors_xi_approx"
          class_name: "KernelMTMMixtureNeighborsApproxCensored"
          external_parameters: {k_mtm: 50, acceptance_wise_type: "pixelwise", scaling_std_approx: 1., scaling_std_censored: 1., do_indicator: false}
        sub_proba: {1: 0., 2: 1.}
      disjoint:
        global_proba: .5
        full_conditional_theta:
          1:
            module_name: "pmala"
            class_name: "KernelPMALA"
            external_parameters: {eps0: 1.0e-4, lambda_: 1.0e-5, alpha: 0.99, compute_correction_term: false, add_perturbation: true, acceptance_wise_type: "pixelwise"}
          sub_proba: {1: 1.0}
        full_conditional_log_xi:
          1:
            module_name: "lognormal_xi_approx_aux"
            class_name: "KernelLogNormalXiApproximationCensored"
            external_parameters: {key_forward_var: "full_conditional_theta", acceptance_wise_type: "full"}
          sub_proba: {1: 1.0}
  map:
    model_checking_component_name: "obs_given_target_log_xi"
    sample_variables:
      full_conditional_theta: true
      full_conditional_log_xi: true
    start_from_type:
      full_conditional_theta: "true"
      full_conditional_log_xi: "true"
    kernels_dic:
      joint:
        global_proba: 0.
        1:
          module_name: "joint_pmala_xi_approx"
          class_name: "KernelPMALAApproxCensored"
          external_parameters: {eps0: 1.0e-3, lambda_: 1.0e-5, alpha: 0.99, compute_correction_term: false, add_perturbation: false, acceptance_wise_type: "pixelwise"}
        2:
          module_name: "joint_mtm_mixture_neighbors_xi_approx"
          class_name: "KernelMTMMixtureNeighborsApproxCensored"
          external_parameters: {k_mtm: 100, acceptance_wise_type: "pixelwise", scaling_std_approx: 1., scaling_std_censored: 1., do_indicator: false}
        sub_proba: {1: 0.5, 2: 0.5}
      disjoint:
        global_proba: 1.
        full_conditional_theta:
          1:
            module_name: "pmala"
            class_name: "KernelPMALA"
            external_parameters: {eps0: 1.0e-3, lambda_: 1.0e-5, alpha: 0.99, compute_correction_term: false, add_perturbation: false, acceptance_wise_type: "pixelwise"}
          sub_proba: {1: 1.0}
        full_conditional_log_xi:
          1:
            module_name: "lognormal_xi_approx_aux"
            class_name: "KernelLogNormalXiApproximationCensored"
            external_parameters: {key_forward_var: "full_conditional_theta", acceptance_wise_type: "full"}
          sub_proba: {1: 1.0}
#
# run params
run_params:
  map:
    rng_seed: 2024
    N_MCMC: 1
    T_MC: 500
    T_BI: 100
    batch_size: 20
    freq_save: 1
    start_from:
      full_conditional_theta: null
      full_conditional_log_xi: null
  mcmc:
    rng_seed: 2024
    N_MCMC: 1
    T_MC: 10000 #3_000
    T_BI: 1500
    plot_1D_chains:
      full_conditional_theta: false # To speed-up the run, set to false otherwise set to true
      full_conditional_log_xi: false
    plot_2D_chains:
      full_conditional_theta: false # To speed-up the run, set to false otherwise set to true
      full_conditional_log_xi: false
    plot_ESS:
      full_conditional_theta: true
      full_conditional_log_xi: false
    plot_comparisons_yspace: false
    batch_size: 10
    freq_save: 1
    start_from:
      full_conditional_theta: null
      full_conditional_log_xi: null
    regu_spatial_N0: !!float inf # sets to infinite
    regu_spatial_scale: 1.0
    regu_spatial_vmin: 1.0e-8
    regu_spatial_vmax: 1.0e+8
    list_CI: [95, 99] # [68, 90, 95, 99]
    save_forward_map_evals: false
#
# Debugging
debugging:
  run_sampling: true
  run_results_extraction: true
  plot_setup: false
