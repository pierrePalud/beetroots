[project]
name = "beetroots"
version = "1.1.0"
description = "Beetroots (BayEsian infErence with spaTial Regularization of nOisy multi-line ObservaTion mapS)"
keywords = [
    "Bayesian inference",
    "statistics",
    "artificial intelligence",
    "multi-line maps",
    "interstellar medium",
]
license = "MIT"
readme = "README.md"
authors = [{ name = "Pierre Palud", email = "address@tocomplete.fr" }]
requires-python = ">=3.12.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
] # https://pypi.org/classifiers/

dependencies = [
    "bayesian-optimization>=3.2.0",
    "cerberus>=1.3.8",
    "click>=8.3.1",
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "numba",
    "nnbma",
    "numba-stats>=1.11.0",
]

[tool.uv.sources]
# https://docs.astral.sh/uv/guides/integration/pytorch/
# FIXME: many tests do not pass on GPU for nnbma, forcing CPU in the meantime?
# ! RuntimeError: Expected all tensors to be on the same device, but got tensors is on cpu, different from other tensors on cuda:0 (when checking argument in method wrapper_CUDA_cat)
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]
# dependency to a local version of a package
nnbma = { path = "../ism-model-nn-approximation" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
# Installing all dependencies (dev dependencies are installed by default if not
# unselected with --no-dev)
# uv sync --all-groups
# Development dependencies
# uv sync installs project in editable mode + dev-dependencies
# uv sync --no-dev not to install dev dependencies
# uv add --dev package-name
dev = [
    "black>=25.11.0",
    "dask>=2026.1.2",
    "distributed>=2026.1.2",
    "flake8>=7.3.0",
    "isort>=6.1.0",
    "pre-commit>=4.5.1",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.9",
    "pytest>=8.4.2",     # run the test suite
    "pytest-cov>=7.0.0", # generate coverage report see --cov --cov-report flags
]
# Documentation is generated with Sphinx
# https://www.sphinx-doc.org/en/master/index.html
# - locally with poetry run sphinx-build -b docs docs/_build/html
# - online either with
#     - ReadTheDocs see .readthedocs.yaml file
#     - GitHub pages see .github/workflows/docs.yml
docs = [
    "esbonio>=0.16.5",             # Language server for .rst files
    "myst-parser>=3.0.1",
    "nbsphinx>=0.9.8",             # permits to include notebooks in the documentation (relies on pandoc, to be installed separately)
    "nbsphinx-link>=1.3.1",        # permits to use notebooks that are not in the docs folder
    "rstcheck>=6.2.5",             # Checks syntax of reStructuredText and code blocks nested within it https://github.com/myint/rstcheck
    "sphinx>=7.4.7",               # Sphinx extensions https://www.sphinx-doc.org/en/master/usage/extensions/index.html
    "sphinx-design>=0.6.1",        # designing beautiful, screen-size responsive web-components.
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-bibtex>=2.6.5", # Manage bibliography .bib files
    # https://github.com/mcmtroffaes/sphinxcontrib-bibtex
]
# uv sync --group notebook --group docs
notebook = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupyter-lsp>=2.3.0",
    "notebook>=7.5.3",
]

[tool.pytest.ini_options]
# uv run pytest
# uv run pytest --collect-only
minversion = "6.0"
addopts = "-ra -q -vv --cov=beetroots --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

# For other tools to be black compliant
# https://black.readthedocs.io/en/stable/guides/using_black_with_other_tools.html
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pylint.format]
max-line-length = "88"

# [tool.poetry.urls]
# repository = "https://github.com/pierrePalud/beetroots"
# Documentation = "https://beetroots.readthedocs.io/en/latest/"
# "Bug Tracker" = "https://github.com/pierrePalud/beetroots/issues"
